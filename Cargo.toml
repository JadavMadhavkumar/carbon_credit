[package]
name = "plastic_waste_backend"
version = "0.0.1"
edition = "2021"
description = "Falkon Future X Carbon Credit Platform - Rust Backend"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
argon2 = "0.5"
rand = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
config = "0.14"
dotenvy = "0.15"
once_cell = "1"
dashmap = "5"
utoipa = { version = "5.5", features = ["macros", "chrono", "uuid", "decimal"] }

reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"
base64 = "0.22"

axum-extra = { version = "0.9", features = ["protobuf"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "validate-request"] }

rust_decimal = { version = "1", features = ["serde", "maths"] }
rust_decimal_macros = "1"

regex = "1"
validator = { version = "0.16", features = ["derive"] }

sqlx-cli = { version = "0.8", features = ["postgres"], optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
hyper = "1"
http-body-util = "0.1"

[features]
default = ["runtime-tokio"]
runtime-tokio = []

[[bin]]
name = "falkon-carbon"
path = "src/main.rs"

[lib]
name = "plastic_waste_backend"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
